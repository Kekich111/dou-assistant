version: "v1.0"
source: "Матрица обязательного визирования проектов внутренних и внешних документов Организации"
notes:
  - "Матрица применяется дополнительно к общему маршруту визирования по Инструкции."
  - "Если проект относится к нескольким строкам, требования применяются совокупно."
  - "Подразделение, чья компетенция затрагивается проектом, включается в маршрут независимо от отметки."

rows:
  - id: internal_calendar_orders
    scope: internal
    title: "Приказы о работе в выходные и нерабочие праздничные дни, по иным вопросам рабочего календаря (по модульным документам)"
    keywords: ["выходные", "праздничные", "рабочий календарь", "работа в выходной"]
    legal: yes
    doc_dept: yes
    hr: yes
    other: []

  - id: internal_handover_orders
    scope: internal
    title: "Приказы о приеме и передаче дел и имущества (по модульным документам)"
    module: order_handover
    keywords: ["прием и передача дел", "передача имущества", "освобождение от должности", "реорганизация"]
    legal: yes
    doc_dept: yes
    hr: yes
    other:
      - dept: "Департамент информационной безопасности"
        condition: "прием и передача дел связаны с предоставлением, изменением или прекращением доступа к информационным системам"

  - id: internal_is_orders
    scope: internal
    title: "Приказы по вопросам информационных систем: ввод и вывод из эксплуатации, опытная эксплуатация, изменение компонентов (по модульным документам)"
    module: order_is_commissioning
    keywords: ["информационная система", "ввод в эксплуатацию", "вывод из эксплуатации", "опытная эксплуатация", "ИС"]
    legal: yes
    doc_dept: yes
    hr: no
    other:
      - dept: "Департамент информационной безопасности"
      - dept: "Департамент информационных технологий"

  - id: internal_other_orders
    scope: internal
    title: "Прочие приказы, в том числе без модульных документов или с модулями, кроме пп. 1-3"
    modules: [order_responsible_docflow, order_local_act]
    legal: yes
    doc_dept: yes
    hr: no
    other: []

  - id: internal_payment_decrees
    scope: internal
    title: "Распоряжения о материальной помощи и иных выплатах работникам"
    legal: no
    doc_dept: yes
    hr: yes
    other: []

  - id: internal_temp_bodies_decrees
    scope: internal
    title: "Распоряжения о создании рабочих групп, проектных комитетов, комиссий и иных временных объединений"
    modules: [decree_workgroup, decree_project_committee]
    keywords: ["рабочая группа", "проектный комитет", "комиссия"]
    legal: no
    doc_dept: yes
    hr: yes
    other:
      - dept: "Департамент информационных технологий"
        condition: "временное объединение создается для реализации ИТ-проекта или решения вопросов информационных систем"

  - id: internal_other_decrees
    scope: internal
    title: "Прочие распоряжения, в том числе без модульных документов или с модулями, кроме пп. 5-6"
    modules: [decree_process_audit]
    legal: yes
    doc_dept: yes
    hr: no
    other: []

  - id: external_gov_letters
    scope: external
    title: "Письма за подписью Руководства органам государственной власти, Администрации Президента РФ, членам Совета Федерации, депутатам Государственной Думы, Аппарату Правительства РФ, Счетной палате РФ"
    legal: yes
    doc_dept: yes
    hr: no
    other:
      - dept: "Департамент внутреннего контроля"

  - id: external_foreign_letters
    scope: external
    title: "Письма за подписью Руководства руководству иностранных организаций, центральных банков иностранных государств, международных организаций"
    legal: yes
    doc_dept: yes
    hr: no
    other:
      - dept: "Департамент международного сотрудничества"

  - id: external_ru_legal_letters
